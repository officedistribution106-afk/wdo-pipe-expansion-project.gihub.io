<style>
/* Layout: dark "control-room" rail on the left, work surface on the right; summary (KPI) → charts → table; forms slide in from the right; leader report renders as an A4 paper sheet. */
:root{

  --ink:#10242A; --ink-2:#465C62; --ink-3:#768A90;

  --ok:#1E8455; --ok-soft:#DDF2E6; --warn:#A86A12; --warn-soft:#FAEED6; --bad:#BC3B35; --bad-soft:#FADFDC; --info:#138A9C; --info-soft:#DDF0F3; --neu:#5D6F74; --neu-soft:#E6ECEE;

  --f-brand:"Moul","Khmer OS Muol Light","Kantumruy Pro",serif;
  --f-code:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#081316; --surface:#0F1F23; --surface-2:#0B191C; --line:#21373D; --line-2:#1A2D32;
  --ink:#E2EDEF; --ink-2:#A4B9BE; --ink-3:#72888D;
  --accent:#5AA7E0; --accent-ink:#04182A; --accent-soft:#132B3F; --accent-deep:#9CC9EE; --plan:#2E6E7B;
  --purple:#4FA9B8; --teal:#3CC3D6; --cyan:#7FD3E3;
  --k1:#1A5A66; --k2:#1F5F92; --k3:#127A8A; --k4:#5BC0D3; --k4-ink:#062A33;

*{box-sizing:border-box}

/* login gate */
/* ---- animated sign-in ---- */
.gate{position:fixed;inset:0;z-index:70;background:var(--bg);display:grid;grid-template-columns:minmax(0,1.15fr) minmax(360px,1fr);overflow-y:auto;animation:gIn .35s ease both}
.gate.leave{animation:gOut .45s ease forwards}
.gate-scene{position:relative;overflow:hidden;background:linear-gradient(155deg,#0D272E 0%,#14505C 58%,#1B6CA8 135%);color:#E6F3F5;min-height:100%}
.gate-scene svg.net{position:absolute;inset:0;width:100%;height:100%}
.gate-scene::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(10,30,36,.92) 0%,rgba(10,30,36,.6) 38%,rgba(10,30,36,0) 70%);pointer-events:none}
.net .pipe{fill:none;stroke:rgba(159,215,227,.16);stroke-linecap:round}
.net .flow{fill:none;stroke:#7FD3E3;stroke-linecap:round;stroke-dasharray:3 26;animation:flow 2.8s linear infinite;opacity:.85}
.net .flow.slow{animation-duration:4.4s}.net .flow.rev{animation-direction:reverse}
.net .node{fill:#0D272E;stroke:#7FD3E3;stroke-width:2}
.net .ping{fill:none;stroke:#7FD3E3;stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:ping 2.6s ease-out infinite}
.gate-copy{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;padding:48px 48px 56px;max-width:620px}

.gate-drop i+i{animation-delay:1.6s}
.gate-copy h2{font-family:var(--f-brand);font-weight:400;font-size:clamp(16px,2.1vw,23px);line-height:1.9;margin:0;color:#fff;text-wrap:balance;animation:rise .7s .2s ease both}

.gate-steps{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.gate-steps span{font-size:12px;padding:4px 10px 4px 8px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);display:inline-flex;gap:6px;align-items:center;animation:rise .6s ease both}
.gate-steps span::before{content:"";width:7px;height:7px;border-radius:50%;background:#7FD3E3;box-shadow:0 0 0 0 rgba(127,211,227,.7);animation:dot 2.4s ease-out infinite}
.gate-steps span:nth-child(1){animation-delay:.45s}.gate-steps span:nth-child(2){animation-delay:.55s}.gate-steps span:nth-child(3){animation-delay:.65s}.gate-steps span:nth-child(4){animation-delay:.75s}
.gate-steps span:nth-child(2)::before{animation-delay:.6s}.gate-steps span:nth-child(3)::before{animation-delay:1.2s}.gate-steps span:nth-child(4)::before{animation-delay:1.8s}
.gate-side{display:grid;place-items:center;padding:32px 20px;position:relative}
.gate-card{width:min(400px,100%);display:flex;flex-direction:column;gap:16px;animation:rise .6s .15s ease both}

.fl{position:relative;display:block;animation:rise .55s ease both}
.fl:nth-of-type(1){animation-delay:.25s}.fl:nth-of-type(2){animation-delay:.33s}

html body .nav-daily{background:none;border:0;padding:0;margin:0 0 10px}html body .nav a.nd-btn{min-height:44px;flex-direction:row}
.map-tabs{margin-bottom:10px}.mq-or{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 4px}.mq-or span{color:var(--ink-3);font-size:13px}.mq-coord{flex:1 1 180px;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-family:var(--f-mono,monospace)}.mq-prev .warn{color:color-mix(in srgb,var(--warn) 85%,var(--ink));font-weight:600}

.mm-warn{padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--warn) 10%,transparent);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);font-size:12.5px;margin-bottom:10px}.mm-nog{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}.btn.sm{padding:3px 10px;min-height:0;font-size:12px}
.mm-list{display:grid;gap:6px;max-height:46vh;overflow:auto}.mm-m{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}.mm-m i{flex:none;width:12px;height:12px;border-radius:3px;background:var(--mc);margin-top:5px}.mm-m small{display:block;color:var(--ink-3)}.mm-m.on{border-color:var(--mc);box-shadow:0 0 0 2px color-mix(in srgb,var(--mc) 30%,transparent)}.mm-m.off{opacity:.55}
.mm-logs{display:grid;gap:4px;max-height:30vh;overflow:auto;font-size:13px}
.pm-u{min-width:0}.pm-u td,.pm-u th{padding:6px 10px}.pm-cell{padding:2px 6px;min-height:0;text-align:left;white-space:nowrap}.pm-sum{font-size:12.5px;color:var(--ink-2)}

/* a project is identified by project code + job code */
const pk=r=>String((r&&r.pcode)||"").trim()+"|"+String((r&&r.jcode)||"").trim();
function projIndex(){const m=new Map();for(const p of rows("projects")){const c=String(p.pcode||"").trim();(m.get(c)||m.set(c,[]).get(c)).push(p);}return m;}
function matchProject(r,pi){const list=(pi||projIndex()).get(String(r.pcode||"").trim())||[];const j=String(r.jcode||"").trim();if(j)return list.find(p=>String(p.jcode||"").trim()===j)||null;return list[0]||null;}
let RC=null;
function results(f){const key=DATAVER+"|"+mode()+"|"+showDemo;if(!RC||RC.key!==key)RC={key,v:baseResults()};const b=RC.v;
  return f?b.filter(r=>(!f.from||r.date>=f.from)&&(!f.to||r.date<=f.to)&&(!f.ptype||r.ptype===f.ptype)&&(!f.work||r.work===f.work)):b;}
function baseResults(){const pi=projIndex();
  return [...rows("progress"),...rows("prior")].map(r=>{const m=matchProject(r,pi);const p=m||{};return {...r,_k:m?pk(m):pk(r),_match:!!m,jcode:r.jcode||p.jcode||"",city:r.city||p.city||cityOf(r.khan?r:p),dn:r.dn||p.dn,khan:r.khan||p.khan,sangkat:r.sangkat||p.sangkat,ptype:r.ptype||p.ptype,leader:r.leader||p.leader,road:r.road||p.road};});}
const isPipe=r=>r.work!=="សាកសម្ពាធ";
function doneByProject(rs){const m=new Map();for(const r of rs)if(isPipe(r))m.set(r._k,(m.get(r._k)||0)+N(r.result));return m;}
function lastStatus(rs){const m=new Map();for(const r of [...rs].sort((a,b)=>String(a.date).localeCompare(String(b.date))))if(isPipe(r))m.set(r._k,r.status);return m;}
const payCalc=v=>`${fM(expSum(v))} · ${t("ម៉ាស៊ូត","Diesel")} ${fN(v.a_diesel,2)} L · ${t("សាំង","Petrol")} ${fN(v.a_petrol,2)} L`;
const costSum=p=>COSTS.reduce((s,k)=>s+N(p[k]),0);const MONEY=["a_labor","a_dig"],FUEL=["a_diesel","a_petrol"];const expSum=p=>MONEY.reduce((s,k)=>s+N(p[k]),0);const fuelSum=p=>FUEL.reduce((s,k)=>s+N(p[k]),0);
/* plan vs result by a project attribute (khan / dn); result capped per project at its plan */
function planVsResult(attr,rs,ptype){const done=doneByProject(rs);const m=new Map();
  for(const p of rows("projects")){if(ptype&&p.ptype!==ptype)continue;const k=p[attr]||NS;const o=m.get(k)||{label:k,plan:0,res:0};o.plan+=N(p.len);o.res+=Math.min(done.get(pk(p))||0,N(p.len));m.set(k,o);}
  return [...m.values()].sort((a,b)=>b.plan-a.plan);}

function bars(data,o={}){if(!data.length)return `<div class="empty-chart">${t("មិនទាន់មានទិន្នន័យ","No data yet")}</div>`;
  const max=Math.max(...data.map(d=>d.value),1);const lim=o.limit||8;const d=data.slice(0,lim);
  if(data.length>lim)d.push({label:t("ផ្សេងៗ","Others")+" ("+(data.length-lim)+")",value:data.slice(lim).reduce((s,x)=>s+x.value,0)});
  const fmt=o.fmt||(v=>fN(v));
  return `<div class="bars">${d.map((x,i)=>`<div class="bar" style="--i:${i}" data-tip="${esc(tv(x.label))}: ${esc(fmt(x.value))}"><span class="bl">${esc(tv(x.label))}</span><span class="bt"><i style="width:${(x.value/max*100).toFixed(1)}%;${o.tone?`background:var(--${TONE[x.label]||"neu"})`:""}"></i></span><span class="bv">${fmt(x.value)}</span></div>`).join("")}</div>`;}
function cols(data,fmt){if(!data.length||data.every(d=>!d.value))return `<div class="empty-chart">${t("មិនទាន់មានទិន្នន័យ","No data yet")}</div>`;
  const max=Math.max(...data.map(d=>d.value),1);
  return `<div class="cols">${data.map((d,i)=>`<div class="col" style="--i:${i}" data-tip="${esc(d.label)}: ${esc(fmt(d.value))}"><i style="height:${(d.value/max*100).toFixed(1)}%"></i>${d.value?`<span>${fmt(d.value)}</span>`:""}</div>`).join("")}</div><div class="col-lbl">${data.map(d=>`<span>${esc(d.label)}</span>`).join("")}</div>`;}
function ring(done,plan){const pct=plan?Math.min(done/plan,1):0;const R=62,C=2*Math.PI*R;
  return `<div class="ring-wrap"><svg width="170" height="170" viewBox="0 0 170 170" role="img" aria-label="${(pct*100).toFixed(1)}%">
  <circle cx="85" cy="85" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="16"/>
  <circle class="ring-arc" style="--c:${C.toFixed(1)}" cx="85" cy="85" r="${R}" fill="none" stroke="var(--accent)" stroke-width="16" stroke-linecap="round" stroke-dasharray="${(C*pct).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 85 85)"/>
  <text x="85" y="84" text-anchor="middle" fill="var(--ink)" font-size="28" font-weight="600" style="font-variant-numeric:tabular-nums">${(pct*100).toFixed(1)}%</text>
  <text x="85" y="106" text-anchor="middle" fill="var(--ink-3)" font-size="12">${t("លទ្ធផល / គម្រោង","Result / plan")}</text></svg>
  <div class="legend c"><span><i style="background:var(--accent)"></i>${t("លទ្ធផល","Result")} ${fN(done)} ${t("ម","m")}</span><span><i style="background:var(--surface-2);border:1px solid var(--line)"></i>${t("នៅសល់","Remaining")} ${fN(Math.max(plan-done,0))} ${t("ម","m")}</span></div></div>`;}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;const s=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;return s*p;}
const shortM=v=>v>=1e6?fN(v/1e6,1)+"M":v>=1000?fN(v/1000,v>=1e4?0:1)+"k":fN(v);
function topPath(x,y,w,h,r){if(h<=0)return "";r=Math.min(r,w/2,h);return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`;}
/* combo: project length vs result as paired columns on ONE axis, completion % labelled above each pair */
var ACID=0;
function combo(data,o={}){
  if(!data.length||data.every(d=>!d.plan&&!d.res))return `<div class="empty-chart">${t("មិនទាន់មានគម្រោងដើម","No original projects yet")}</div>`;
  /* overlapping columns (result inside plan) + smooth % curve on a right axis — fits the panel, no scrolling */
  const n=data.length,rot=n>7,W=Math.max(520,n*58+90),pl=46,pr=40,pt=26,pb=rot?70:40,H=o.h||260,gw=(W-pl-pr)/n;
  const ih=H-pt-pb,max=niceMax(Math.max(...data.map(d=>Math.max(d.plan,d.res)))),y=v=>pt+ih-(v/max)*ih,yp=v=>pt+ih-Math.min(v,1.1)/1.1*ih,cx=i=>pl+gw*(i+.5);
  const id="cb"+(++ACID);

  for(let i=0;i<=4;i++){const v=max*i/4,yy=y(v);s+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1" ${i?'stroke-dasharray="2 4"':""}/><text x="${pl-6}" y="${yy+4}" text-anchor="end" font-size="10.5" fill="var(--ink-3)">${shortM(v)}</text><text x="${W-pr+6}" y="${pt+ih-ih*(i*.25)/1.1+4}" font-size="10" fill="var(--ink-3)">${i*25}%</text>`;}
  const pts=[];

    s+=`<path class="cm" style="--i:${i}" d="${topPath(x-rw/2,y(d.res),rw,ih*d.res/max,4)}" fill="url(#${id}r)"/>`;

  s+=`<path d="${smoothPath(pts)}" fill="none" stroke="#6F41C1" stroke-width="2" stroke-linecap="round" stroke-opacity=".85" class="cv"/>`;
  data.forEach((d,i)=>{const pct=d.plan?d.res/d.plan:0,[x,yy]=pts[i];
    s+=`<circle cx="${x}" cy="${yy}" r="3.6" fill="var(--surface)" stroke="#6F41C1" stroke-width="2"/><text x="${x}" y="${yy-8}" text-anchor="middle" font-size="10.5" font-weight="600" fill="#6F41C1">${(pct*100).toFixed(0)}%</text>`;
    const lbl=esc(tv(d.label));s+=`<rect class="hit" x="${x-gw/2}" y="${pt}" width="${gw}" height="${ih}" fill="transparent" data-tip="${lbl}&#10;${t("ប្រវែងគម្រោង","Project length")}: ${fN(d.plan)} ${t("ម","m")}&#10;${t("ប្រវែងលទ្ធផល","Result")}: ${fN(d.res)} ${t("ម","m")}&#10;${t("សម្រេចបាន","Achieved")}: ${(pct*100).toFixed(1)}%"/>`;});
  s+=`<line x1="${pl}" x2="${W-pr}" y1="${pt+ih}" y2="${pt+ih}" stroke="var(--ink-3)" stroke-width="1"/></svg>`;
  return `<div class="legend" style="margin-bottom:6px"><span><i style="background:var(--plan)"></i>${t("ប្រវែងគម្រោង (ម)","Project length (m)")}</span><span><i style="background:var(--accent)"></i>${t("ប្រវែងលទ្ធផល (ម) — ត្រួតលើ","Result length (m) — overlaid")}</span><span><i style="background:#6F41C1;height:3px;border-radius:2px"></i>${t("ខ្សែកោង % សម្រេច (អ័ក្សស្តាំ)","% achieved curve (right axis)")}</span></div><div class="combo-wrap fit">${s}</div>`;}

/* ---------- staff work location (live, working hours only; seen by the Office Manager only) ----------
   sloc/{uid}            latest point of one person   {u,name,tg,staff,lat,lng,acc,at,day,n,src}
   sloc/{uid}/days/{day} that day's track             {u,day,pts:[{t,la,ln,ac}]}
   ids starting "tg_" come from a Telegram bot import (CSV), ready for a bot server later */
const SL_DEF={on:true,from:"08:00",to:"16:00",days:[1,2,3,4,5],int:2};let SLCFG=null,memSL=null;
const slCfg=()=>({...SL_DEF,...(SLCFG||memSL||{})});
function ppNow(d){const o={};new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Phnom_Penh",weekday:"short",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(d||new Date()).forEach(x=>o[x.type]=x.value);
  return {wd:{Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[o.weekday],hm:(o.hour==="24"?"00":o.hour)+":"+o.minute,day:`${o.year}-${o.month}-${o.day}`};}
function slInHours(d){const c=slCfg();if(!c.on)return false;const n=ppNow(d);return c.days.includes(n.wd)&&n.hm>=c.from&&n.hm<c.to;}
const distM=(a,b)=>{const R=6371000,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r;const h=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));};
const hmOf=ms=>{const n=new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Phnom_Penh",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(ms));return n;};
const agoT=ms=>{const m=Math.max(0,Math.round((Date.now()-ms)/60000));return m<1?t("ឥឡូវនេះ","just now"):m<60?`${fN(m)} ${t("នាទីមុន","min ago")}`:m<1440?`${fN(Math.floor(m/60))} ${t("ម៉ោងមុន","h ago")}`:`${fN(Math.floor(m/1440))} ${t("ថ្ងៃមុន","d ago")}`;};
const DAYN=()=>[t("អាទិត្យ","Sun"),t("ច័ន្ទ","Mon"),t("អង្គារ","Tue"),t("ពុធ","Wed"),t("ព្រហស្បតិ៍","Thu"),t("សុក្រ","Fri"),t("សៅរ៍","Sat")];
const slHoursTxt=()=>{const c=slCfg();const D=DAYN();const ds=c.days.slice().sort();const run=ds.length>1&&ds.every((d,i)=>!i||d===ds[i-1]+1);return `${run?D[ds[0]]+"–"+D[ds[ds.length-1]]:ds.map(d=>D[d]).join(", ")} · ${c.from}–${c.to}`;};

/* -- sender: runs on each signed-in phone/tablet while the app is open, only inside working hours -- */
const SLT={watch:null,last:null,lastSent:0,pts:null,day:"",state:"idle",err:"",ack:null,later:false,busy:false};
const slDevice=()=>{try{return matchMedia("(pointer:coarse)").matches||/iPhone|iPad|Android|Mobile/i.test(navigator.userAgent);}catch(e){return false;}};
const slEligible=()=>!!(db&&MY_ID&&ACCOUNT&&ACCOUNT.status==="active"&&slDevice()&&navigator.geolocation);
async function slAck(){if(SLT.ack!==null)return SLT.ack;SLT.ack=false;try{const sn=await db.doc("sloc/"+MY_ID).get();SLT.ack=!!(sn.exists&&sn.data().ack);}catch(e){}return SLT.ack;}
async function slTick(){const run=slEligible()&&slInHours()&&document.visibilityState==="visible";
  if(run){if(!(await slAck())){if(!SLT.later)slNotice();SLT.state="ask";}else if(SLT.watch==null)slStart();}
  else if(SLT.watch!=null){navigator.geolocation.clearWatch(SLT.watch);SLT.watch=null;SLT.state="idle";}
  if(!run&&SLT.state!=="denied")SLT.state="idle";slChip();}
function slStart(){if(SLT.watch!=null)return;SLT.state="wait";
  SLT.watch=navigator.geolocation.watchPosition(slPos,e=>{SLT.state=e&&e.code===1?"denied":"err";SLT.err=e&&e.message||"";if(e&&e.code===1&&SLT.watch!=null){navigator.geolocation.clearWatch(SLT.watch);SLT.watch=null;}slChip();},{enableHighAccuracy:true,maximumAge:30000,timeout:60000});slChip();}
async function slPos(p){const g={lat:p.coords.latitude,lng:p.coords.longitude},acc=p.coords.accuracy||0,now=Date.now();SLT.state="on";
  const c=slCfg();const moved=SLT.last?distM(SLT.last,g):1e9;if(SLT.busy||!(now-SLT.lastSent>=c.int*60000||(moved>=50&&now-SLT.lastSent>=30000))){slChip();return;}
  if(!slInHours())return;SLT.busy=true;try{await slSend(g,acc,now);SLT.last=g;SLT.lastSent=now;SLT.err="";}catch(e){SLT.err=(e&&e.code)||"write";console.warn("[sloc]",e&&e.code);}finally{SLT.busy=false;slChip();}}
async function slSend(g,acc,now){const day=ppNow(new Date(now)).day;if(SLT.day!==day){SLT.day=day;SLT.pts=null;}
  const ref=db.doc(`sloc/${MY_ID}/days/${day}`);if(SLT.pts==null){try{const sn=await ref.get();const d=sn.exists?sn.data():null;SLT.pts=d&&Array.isArray(d.pts)?d.pts:[];}catch(e){SLT.pts=[];}}
  SLT.pts.push({t:now,la:+g.lat.toFixed(6),ln:+g.lng.toFixed(6),ac:Math.round(acc)});if(SLT.pts.length>600)SLT.pts=SLT.pts.slice(-600);
  const a=ACCOUNT;const st=rows("staff").find(s=>a.staffCode&&s.code===a.staffCode);
  await ref.set({u:a.username,day,pts:SLT.pts});
  await db.doc("sloc/"+MY_ID).set({u:a.username,name:a.name||"",tg:a.telegram||(st&&st.tg)||"",staff:a.staffCode||"",role:(st&&st.role)||"",lat:+g.lat.toFixed(6),lng:+g.lng.toFixed(6),acc:Math.round(acc),at:now,day,n:SLT.pts.length,src:"app",ack:true});}

  document.body.appendChild(md);md.onclick=async e=>{const b=e.target.closest("[data-sl]");if(!b)return;md.remove();

function slChip(){let el=$("#slChip");const show=slEligible()&&slInHours();if(!show){if(el)el.remove();return;}
  if(!el){el=document.createElement("button");el.id="slChip";el.type="button";document.body.appendChild(el);el.onclick=()=>{if(SLT.state==="on"||SLT.state==="wait"){toast(`${t("កំពុងចែករំលែកទីតាំងការងារ","Sharing work location")} · ${slHoursTxt()}${SLT.lastSent?" · "+t("ផ្ញើចុងក្រោយ","last sent")+" "+hmOf(SLT.lastSent):""}`);return;}SLT.later=false;if(SLT.ack)slStart();else slNotice();};}
  const M={on:["on","📍 "+t("កំពុងចែករំលែកទីតាំង","Sharing location")],wait:["wait","📍 "+t("កំពុងរកទីតាំង…","Finding location…")],denied:["off","⚠ "+t("ទីតាំងត្រូវបានបិទ — ចុចដើម្បីបើក","Location blocked — tap to retry")],err:["off","⚠ "+t("រកទីតាំងមិនបាន","Location unavailable")],ask:["off","📍 "+t("ចុចដើម្បីចែករំលែកទីតាំង","Tap to share location")],idle:["off","📍 "+t("ចុចដើម្បីចែករំលែកទីតាំង","Tap to share location")]};
  const [c,l]=M[SLT.state]||M.idle;el.className="sl-chip "+c;el.textContent=l+(SLT.state==="on"&&SLT.lastSent?" · "+hmOf(SLT.lastSent):"");}

function adminOnly(){if(REAL_ADMIN())return true;toast(t("មុខងារនេះសម្រាប់តែរដ្ឋបាលប៉ុណ្ណោះ","Only administrators can manage accounts"));return false;}
const ADMIN_ERR={code:"admin_only"};
/* true when, after the change, no active admin account would remain (only counts once accounts exist) */
function lastAdminLeft(a,after){const L=acctList();if(!L.length)return false;const act=L.filter(x=>x.role==="admin"&&x.status==="active"&&x!==a);return !act.length&&a.role==="admin"&&a.status==="active"&&!(after&&after.role==="admin"&&after.status==="active");}

  const m=document.createElement("div");m.innerHTML=`<div class="scrim" style="z-index:60" data-x="1"></div><form class="modal wide" id="bForm" novalidate><h3>${t("បង្កើតគណនីប្រធានក្រុម","Team leader accounts")} (${fN(names.length)})</h3><p>${t("បញ្ចូលឈ្មោះអ្នកប្រើ និងពាក្យសម្ងាត់សម្រាប់អ្នកដែលចង់បង្កើត។ ជួរដែលទុកទទេ នឹងមិនបង្កើតទេ។","Type a username and password for each person you want to create. Rows left blank are skipped.")}</p>

      if(msg){E.textContent=names[i]+" — "+msg;E.hidden=false;(u&&!msg.includes(t("ពាក្យសម្ងាត់","Password"))?m.querySelector(`[data-bu="${i}"]`):m.querySelector("#bp"+i)).focus();return;}

   :`<div class="tbl-wrap copysrc" style="margin-bottom:14px"><table><thead><tr><th>${t("ឈ្មោះ","Name")}</th><th>${t("ឈ្មោះអ្នកប្រើ","Username")}</th><th>${t("ពាក្យសម្ងាត់","Password")}</th></tr></thead><tbody>${list.map(c=>`<tr><td>${esc(c.name)}</td><td class="mono">${esc(c.username)}</td><td class="mono">${esc(c.password)}</td></tr>`).join("")}</tbody></table></div>`}
   <div class="row"><button class="btn" data-c="copy">${svg("copy",16)}${t("ចម្លង","Copy")}</button><button class="btn" data-c="slips">${svg("print",16)}${t("សន្លឹកបោះពុម្ព","Print slips")}</button><button class="btn primary" data-c="done">${t("រួចរាល់","Done")}</button></div></div>`;
  document.body.appendChild(m);
  m.addEventListener("click",e=>{const b=e.target.closest("[data-c]");if(!b)return;const c=b.dataset.c;
    if(c==="copy")copyText(txt,b);else if(c==="done")m.remove();
    else saveFile(`account-slips-${today()}.html`,printDoc(t("សន្លឹកគណនី","Account slips"),`<style>.slip{border:1px dashed #888;border-radius:6px;padding:12px 14px;margin:0 0 10px;page-break-inside:avoid}.slip b{font-family:"IBM Plex Mono",monospace;font-size:15px}</style>${list.map(c=>`<div class="slip"><div style="font-family:"Khmer OS Muol Light",Moul,serif;font-size:11px">${t("ប្រព័ន្ធគ្រប់គ្រងគម្រោងពង្រីកបណ្តាញទឹក","Water network extension system")}</div><div>${t("ឈ្មោះ","Name")}: ${esc(c.name)} · ${c.role==="admin"?t("រដ្ឋបាល","Admin"):t("ប្រធានក្រុម","Team leader")}</div><div>${t("ឈ្មោះអ្នកប្រើ","Username")}: <b>${esc(c.username)}</b> &nbsp; ${t("ពាក្យសម្ងាត់","Password")}: <b>${esc(c.password)}</b></div><div style="font-size:10.5px;color:#555">${t("សូមរក្សាទុកជាសម្ងាត់ ហើយកុំចែករំលែកជាមួយអ្នកដទៃ។","Keep this private and do not share it.")}</div></div>`).join("")}`));});

   <div class="field"><label for="eRole">${t("តួនាទីក្នុងប្រព័ន្ធ","System role")}</label><select id="eRole" ${self?"disabled":""}>${ROLE4().map(([v,l])=>`<option value="${v}" ${a.role===v?"selected":""}>${l}</option>`).join("")}</select></div>

   <div class="field"><label for="ePw">${t("ពាក្យសម្ងាត់ថ្មី","New password")}</label>${pwField("ePw",t("ទុកទទេ = មិនប្តូរ","Blank = keep current"))}</div>

  $("#eUser").oninput=e=>{const v=e.target.value.toLowerCase().replace(/\s+/g,"");if(v!==e.target.value)e.target.value=v;};
  $("#eForm").onsubmit=async e=>{e.preventDefault();const E=$("#eErr");E.hidden=true;const name=$("#eName").value.trim();if(!name){$("#eName").focus();return;}
    const tg=$("#eTg").value.trim();if(tg&&!/^@?[A-Za-z0-9_]{5,32}$/.test(tg)){toast(t("ឈ្មោះ Telegram មិនត្រឹមត្រូវ","Invalid Telegram username"));return;}
    const u=$("#eUser").value.trim().toLowerCase(),pw=$("#ePw").value;const msg=credErr(u,pw,u===a.username,false);
    if(msg){E.textContent=msg;E.hidden=false;(msg.includes(t("ពាក្យសម្ងាត់","Password"))?$("#ePw"):$("#eUser")).focus();return;}
    const role=$("#eRole").value;if(u===a.username&&!pw&&name===a.name&&role===a.role&&tg.replace(/^@/,"")===(a.telegram||"")){m.remove();return;}

      if(pw||u!==a.username)showCreds([{...c,password:pw||t("(មិនប្តូរ)","(unchanged)")}]);else toast(t("បានរក្សាទុក","Saved"));refresh();}

function confirmBox(title,msg,okLbl,fn,danger){const m=document.createElement("div");m.innerHTML=`<div class="scrim" style="z-index:60" data-x="1"></div><div class="modal" role="alertdialog" aria-labelledby="mT"><h3 id="mT">${esc(title)}</h3><p>${msg}</p><div class="row"><button class="btn" data-x="1">${t("បោះបង់","Cancel")}</button><button class="btn ${danger?"danger solid":"primary"}" data-y="1">${esc(okLbl)}</button></div></div>`;

function handHistoryHtml(p){const h=(p.handovers&&p.handovers.length)?p.handovers:(p.leader&&p.hdate?[{to:p.leader,date:p.hdate,by:p.hby,note:p.hnote}]:[]);if(!h.length)return "";const st=handState(p,firstReports());

    for(const deep of [false,true]){for(let i=1;i<=n;i++){const pg=await doc.getPage(i);const v1=pg.getViewport({scale:1});const v=pg.getViewport({scale:Math.min(4,2200/Math.max(v1.width,v1.height))});

  return {lines,extra,qty:lines.reduce((a,o)=>a+o.r.flags.over,0)+extra.reduce((a,e)=>a+e.left,0),val:lines.reduce((a,o)=>a+o.r.flags.over*o.r.unit,0)};}

  return (F||[]).length?`<span class="iss-sum"><b class="ok">✓ ${t("បើក","Issued")} ${fN(c.ok+c.okm+c.cok+c.over)}/${fN(F.length)}</b>${c.mkt?` · <b class="mk">🛒 ${t("ទិញទីផ្សារ","Bought")} ${fN(c.mkt)}</b>`:""}${c.part?` · <b class="pt">◐ ${t("បើកខ្លះ","Partly")} ${fN(c.part)}</b>`:""}${c.no+c.cno?` · <b class="no">✗ ${t("ពុំទាន់","Not yet")} ${fN(c.no+c.cno)}</b>`:""}${c.over?` · <b class="no">⚠ ${t("ត្រូវបញ្ចូលស្តុកវិញ","To return to stock")} ${fN(c.over)}${rt?` (${fmtAcc(rt)} ៛)`:""}</b>`:""}${rd?` · <b class="ok">${t("បានបញ្ចូលស្តុកវិញ","Returned")} ${fN(rd)}</b>`:""}${multi?` · <b class="pt">${t("បើកច្រើនដង/ស្ទួន","Several slips/duplicate")} ${fN(multi)}</b>`:""}${cd?` · <b class="pt">${t("លេខកូដខុស","Other code")} ${fN(cd)}</b>`:""}${mt?` · ${t("ចំណាយទិញទីផ្សារ","Market spend")} <b class="num">${fmtAcc(mt)} ៛</b>`:""}</span>`:"";}

function bindMap(){const c=$("#mapCanvas");if(!c)return;const ptrs=new Map();let start=null,moved=false,pinch=0;
  const svgPt=(cx,cy)=>{const sv=$("#mapSvg");const m=sv&&sv.getScreenCTM();if(!m)return null;const p=sv.createSVGPoint();p.x=cx;p.y=cy;return p.matrixTransform(m.inverse());};

  c.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.deltaY<0?1.3:1/1.3,svgPt(e.clientX,e.clientY));},{passive:false});
  c.addEventListener("pointerdown",e=>{if(ui(e))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;start={x:e.clientX,y:e.clientY,v:{...S.map.vw}};
    if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y);}});
  c.addEventListener("pointermove",e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch){zoomAt(d/pinch,svgPt((a.x+b.x)/2,(a.y+b.y)/2));moved=true;}pinch=d;return;}
    if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;if(!moved&&Math.hypot(dx,dy)<5)return;
    if(!moved){moved=true;c.classList.add("drag");try{c.setPointerCapture(e.pointerId)}catch(er){}}
    const sv=$("#mapSvg");const k=(sv&&sv.getScreenCTM()||{a:1}).a;const ls=(MB.LN1-MB.LN0)/start.v.z,la=(MB.LA1-MB.LA0)/start.v.z;

  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=0;if(ptrs.size)return;c.classList.remove("drag");

  const tk={lat:11.478,lng:104.950};s+=`<ellipse cx="${X(tk)}" cy="${Y(tk)}" rx="${X({lng:105.0})-X(tk)}" ry="${Y({lat:11.44})-Y(tk)}" fill="#138A9C" fill-opacity=".05" stroke="#138A9C" stroke-opacity=".5" stroke-dasharray="5 4"/>`;

/* smooth monotone curve (no overshoot) through points [[x,y],...] */
function smoothPath(P,move){const n=P.length;if(!n)return "";let d=(move===false?" L":"M")+P[0][0].toFixed(1)+","+P[0][1].toFixed(1);if(n<2)return d;

  const tg=[m[0]];for(let i=1;i<n-1;i++)tg[i]=m[i-1]*m[i]<=0?0:(m[i-1]+m[i])/2;tg[n-1]=m[n-2];
